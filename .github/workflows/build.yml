name: Compila APK

# Parte da sola a ogni modifica del codice (non quando modifichi solo le firme
# o il README), oppure a mano dal tab "Actions" → "Compila APK" → "Run workflow".
on:
  push:
    branches: [main]
    paths-ignore:
      - "config/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Compila
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk StopScroll-v${{ github.run_number }}.apk

      - name: Pubblica la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: StopScroll v${{ github.run_number }}
          body: Scarica il file .apk qui sotto e installalo sopra la versione precedente.
          files: StopScroll-v${{ github.run_number }}.apk
